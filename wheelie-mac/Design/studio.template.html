<title>Taller de Motos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a bench. Left rail picks the machine, the big stage shows it side-on with the real wheelbase,
   and a contact sheet below compares the whole garage at one scale. */
:root{
  --bg:#EEF1F2; --panel:#FFFFFF; --ink:#172127; --mute:#5B6A72; --line:#D3DADD; --accent:#C8421C; --stage:#E3EAED; --ground:#9AA7AD;
  --font-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --font-d:"Space Grotesk","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10171B;--panel:#192227;--ink:#E7EDEF;--mute:#93A2AA;--line:#2B373D;--accent:#FF8A57;--stage:#1D282E;--ground:#42535B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171B;--panel:#192227;--ink:#E7EDEF;--mute:#93A2AA;--line:#2B373D;--accent:#FF8A57;--stage:#1D282E;--ground:#42535B;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-ui);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px}
h1{font:600 24px/1.1 var(--font-d);margin:0;letter-spacing:-.01em}
.sub{color:var(--mute);margin:4px 0 0;max-width:62ch}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;margin-bottom:16px}
.tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.tools label{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:12.5px}
.sw{display:flex;gap:6px}
.sw button{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
.sw button[aria-pressed="true"]{border-color:var(--ink)}
.main{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px}
@media(max-width:760px){.main{grid-template-columns:1fr}}
nav{display:flex;flex-direction:column;gap:2px}
@media(max-width:760px){nav{flex-direction:row;flex-wrap:wrap}}
nav button{font:inherit;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:7px 10px;color:var(--mute);cursor:pointer;border-radius:0 6px 6px 0}
nav button small{display:block;font-size:11.5px;opacity:.8}
nav button[aria-current="true"]{color:var(--ink);border-left-color:var(--accent);background:var(--panel);font-weight:600}
nav button:focus-visible,.sw button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0}
.stage svg{display:block;width:100%;height:auto;max-height:78vh}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:16px}
.cell{background:var(--stage);border:1px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;min-width:0}
.cell b{display:block;font:600 12px var(--font-d);padding:2px 6px;color:var(--mute)}
.cell svg{display:block;width:100%;height:auto}
.note{color:var(--mute);font-size:12.5px;margin:10px 2px 0}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;600&display=swap">

<header>
  <div><h1>Taller de Motos</h1>
  <p class="sub">Las siluetas de Wheelie Ride a escala real: la distancia entre ejes, las ruedas y los puntos del piloto son los de la física. Lo que se ve aquí es lo que se dibuja en el juego.</p></div>
  <div class="tools">
    <div class="sw" id="sw" role="group" aria-label="Color de pintura"></div>
    <label><input type="checkbox" id="anch" checked> Puntos del piloto</label>
    <label><input type="checkbox" id="ghost" checked> Piloto de referencia</label>
  </div>
</header>
<div class="main">
  <nav id="nav" aria-label="Motos"></nav>
  <div><div class="stage" id="stage"></div><p class="note" id="note"></p></div>
</div>
<div class="sheet" id="sheet"></div>

<script>
/*BIKES_JS*/
</script>
<script>
const D = DESIGN, NAMES = {commuter:['Street 125','Uso diario'],scrambler:['Scrambler 400','Asfalto y tierra'],electric:['Volt E-8','Eléctrica'],motocross:['Enduro 250','Campo y saltos'],trials:['Trial 200','Equilibrio y técnica'],cruiser:['Cruiser 750','Crucero relajado'],scooter:['Scooter 80','Ligero y urbano'],sport:['Sport 600','Alta potencia'],hyperbike:['Hyper R 1000','Superdeportiva'],bmx:['BMX','Sin motor']};
const ORDER = ['bmx','commuter','scrambler','electric','motocross','trials','cruiser','scooter'];
const PAINTS = ['#E9A82B','#D9402B','#2F7FD0','#2E9E6A','#EDEFF0','#1D2327'];
let cur = ORDER.includes(location.hash.slice(1)) ? location.hash.slice(1) : ORDER[0], paint = PAINTS[0];
const INK = '#141B20';
function hex(c){return [1,3,5].map(i=>parseInt(c.slice(i,i+2),16))}
function mix(c,t,k){const a=hex(c),b=hex(t);return '#'+a.map((v,i)=>Math.round(v+(b[i]-v)*k).toString(16).padStart(2,'0')).join('')}
function roleCols(role){
  if(role==='paint') return [mix(paint,'#ffffff',.42),paint,mix(paint,'#000000',.32)];
  if(role==='paintDk') return [mix(paint,'#000000',.4),mix(paint,'#000000',.5)];
  return D.roles[role]||['#888','#444'];
}
let uid=0;
function render(kind){
  const R = D.rigs[kind], layers = D.bikes[kind]||[], id='g'+(uid++);
  const defs=[], cache={};
  function grad(role){
    if(cache[role]) return cache[role];
    const c=roleCols(role), gid=id+role; let st;
    if(c.length===1) st=`<stop offset="0" stop-color="${c[0]}"/>`;
    else if(c.length===2) st=`<stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/>`;
    else st=`<stop offset="0" stop-color="${c[0]}"/><stop offset=".2" stop-color="${c[1]}"/><stop offset=".56" stop-color="${c[1]}"/><stop offset=".58" stop-color="${c[2]}"/><stop offset="1" stop-color="${c[2]}"/>`;
    defs.push(`<linearGradient id="${gid}" x1="0" y1="1" x2="0" y2="0">${st}</linearGradient>`);
    return cache[role]=`url(#${gid})`;
  }
  const flat = role => roleCols(role)[Math.min(1,roleCols(role).length-1)];
  const ax = (t)=>{const dx=R.fm[0]-R.F,dy=R.fm[1],l=Math.hypot(dx,dy);return [R.F+dx/l*t,dy/l*t]};
  const flen = Math.hypot(R.fm[0]-R.F,R.fm[1]);
  const wheel=(x,front)=>{
    let s=`<g transform="translate(${x} 0)"><circle r="${R.R}" fill="#1A2228" stroke="${INK}" stroke-width=".9"/>`;
    s+=`<circle r="${R.R*.9}" fill="none" stroke="#3A464E" stroke-width="1"/><circle r="${R.R*.78}" fill="#C9D1D4" stroke="${INK}" stroke-width=".7"/><circle r="${R.R*.7}" fill="#26323A"/>`;
    for(let i=0;i<18;i++){const a=i*Math.PI/9;s+=`<line x1="0" y1="0" x2="${Math.cos(a)*R.R*.7}" y2="${Math.sin(a)*R.R*.7}" stroke="#AEB9BE" stroke-width=".55"/>`}
    if(front) s+=`<circle r="${R.R*.44}" fill="#9AA6AB" stroke="${INK}" stroke-width=".5"/><circle r="${R.R*.36}" fill="#34414A"/>`;
    return s+`<circle r="${R.R*.15}" fill="#8E9BA1" stroke="${INK}" stroke-width=".7"/><circle r="${R.R*.06}" fill="#202A30"/></g>`;
  };
  const tube=(p,w,c,e)=>`<path d="${p}" fill="none" stroke="${e||INK}" stroke-width="${w+1.7}" stroke-linecap="round" stroke-linejoin="round"/><path d="${p}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const pv=R.pivot, lowShock=[pv[0]*.48,pv[1]*.48];
  const mech = {
    farFork: tube(`M${ax(flen+5)} L${R.F} 0`.replace(/,/g,' '),3.2,'#56646C'),
    swing: tube(`M${pv[0]} ${pv[1]} L0 0`,5,'#323E45'),
    shock: (()=>{let s='',a=R.shock,b=lowShock,n=9;for(let i=0;i<n;i++){const t=(i+.5)/n,p=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];s+=`<line x1="${p[0]-2.6}" y1="${p[1]+.9}" x2="${p[0]+2.6}" y2="${p[1]-.9}" stroke="#B8C2C6" stroke-width="1.5"/>`}return `<path d="M${a[0]} ${a[1]}L${b[0]} ${b[1]}" stroke="#1A2227" stroke-width="2" fill="none"/>`+s})(),
    nearFork: tube(`M${ax(flen+6)} L${R.F} 0`.replace(/,/g,' '),4.4,'#CBD3D6')+tube(`M${ax(flen*.42)} L${R.F} 0`.replace(/,/g,' '),3.2,'#8E9BA1'),
    bars: (()=>{const t=ax(flen+7);return tube(`M${t[0]} ${t[1]} L${R.fm[0]+(R.grip[0]-R.fm[0])*.4} ${R.fm[1]+(R.grip[1]-R.fm[1])*.55} L${R.grip[0]} ${R.grip[1]}`,2.4,'#C7CED1')+`<circle cx="${R.grip[0]}" cy="${R.grip[1]}" r="3.4" fill="#151C20"/>`})(),
    peg: `<path d="M${R.peg[0]-4} ${R.peg[1]}L${R.peg[0]+7} ${R.peg[1]}" stroke="${INK}" stroke-width="4" stroke-linecap="round"/><path d="M${R.peg[0]-4} ${R.peg[1]}L${R.peg[0]+7} ${R.peg[1]}" stroke="#7D8A91" stroke-width="2.4" stroke-linecap="round"/>`
  };
  function drawLayer(l){
    if(l.t==='f') return `<path d="${l.d}" fill="${grad(l.role)}" stroke="${INK}" stroke-width="${l.ol}" stroke-linejoin="round"/>`;
    if(l.t==='s'){const c=flat(l.role);return tube(l.d,l.w,c,'#12191D')+`<path d="${l.d}" fill="none" stroke="${mix(c,'#ffffff',.45)}" stroke-width="${Math.max(.5,l.w*.22)}" stroke-linecap="round" transform="translate(-${l.w*.15} ${l.w*.2})" opacity=".8"/>`}
    if(l.t==='c') return `<circle cx="${l.x}" cy="${l.y}" r="${l.r}" fill="${grad(l.role)}" stroke="${INK}" stroke-width=".6"/>`;
    if(l.t==='l') return `<path d="${l.d}" fill="none" stroke="${l.role==='paintDk'?roleCols('paintDk')[0]:flat(l.role)}" stroke-width="${l.w}" stroke-linecap="round" opacity="${l.a}"/>`;
    if(l.t==='x') return `<text transform="translate(${l.x} ${l.y}) scale(1 -1)" text-anchor="middle" dominant-baseline="central" font-family="Space Grotesk,sans-serif" font-weight="700" font-size="${l.size}" fill="${flat(l.role)}">${l.str}</text>`;
    return '';
  }
  const Z=z=>layers.filter(l=>l.z===z).map(drawLayer).join('');
  const bm=kind==='bmx';let body=wheel(0,false)+wheel(R.F,true)+mech.farFork+(bm?'':mech.swing+mech.shock)+Z(0)+(bm?`<circle cx="45" cy="0" r="6" fill="#AEBBBC" stroke="${INK}" stroke-width=".8"/>`:mech.swing)+Z(1)+mech.nearFork+Z(2)+mech.bars+Z(3)+mech.peg;
  let over='';
  if(document.getElementById('ghost').checked){
    const h=R.seat,hd=R.grip,pg=R.peg;
    const knee=[(h[0]+pg[0])/2+7,(h[1]+pg[1])/2+3];
    const sh=[h[0]+ (kind==='cruiser'?6:14), h[1]+ (kind==='cruiser'?22:20)];
    over=`<g opacity=".34" stroke="#0E3E6B" stroke-linecap="round" fill="none" stroke-width="7"><path d="M${h} L${knee} L${pg}"/><path d="M${h} L${sh}"/><path d="M${sh} L${hd}"/></g><circle cx="${sh[0]+4}" cy="${sh[1]+9}" r="7.5" fill="#0E3E6B" opacity=".34"/>`;
  }
  if(document.getElementById('anch').checked){
    const dot=(p,t)=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.2" fill="none" stroke="#E0452B" stroke-width="1"/><text transform="translate(${p[0]+4} ${p[1]-4}) scale(1 -1)" font-size="5.6" fill="#E0452B" font-family="Inter,sans-serif">${t}</text>`;
    over+=dot(R.seat,'asiento')+dot(R.grip,'puño')+dot(R.peg,'estribo');
  }
  const pad=14,x0=-R.R-pad-6,x1=R.F+R.R+pad+4,y0=-R.R-4,y1=Math.max(R.grip[1]+30,R.fm[1]+34);
  const gy=-R.R;
  return `<svg viewBox="${x0} ${-y1} ${x1-x0} ${y1-y0}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${NAMES[kind][0]}"><defs>${defs.join('')}</defs><g transform="scale(1 -1)"><path d="M${x0} ${gy-.5}H${x1}" stroke="var(--ground)" stroke-width="1.2"/>${body}${over}</g></svg>`;
}
function ui(){
  const nav=document.getElementById('nav');
  nav.innerHTML=ORDER.map(k=>`<button data-k="${k}" aria-current="${k===cur}">${NAMES[k][0]}<small>${NAMES[k][1]}</small></button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=b.dataset.k;try{history.replaceState(null,'','#'+cur)}catch(e){}ui()});
  document.getElementById('stage').innerHTML=render(cur);
  document.getElementById('note').textContent=`${NAMES[cur][0]} · distancia entre ejes ${D.rigs[cur].F} u · rueda ${D.rigs[cur].R} u · ${D.bikes[cur].length} piezas`;
  document.getElementById('sheet').innerHTML=ORDER.map(k=>`<div class="cell" data-k="${k}"><b>${NAMES[k][0]}</b>${render(k)}</div>`).join('');
  document.querySelectorAll('.cell').forEach(c=>c.onclick=()=>{cur=c.dataset.k;ui();scrollTo({top:0})});
}
const sw=document.getElementById('sw');
sw.innerHTML=PAINTS.map(p=>`<button style="background:${p}" data-p="${p}" aria-label="Pintura ${p}" aria-pressed="${p===paint}"></button>`).join('');
sw.querySelectorAll('button').forEach(b=>b.onclick=()=>{paint=b.dataset.p;sw.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));ui()});
document.getElementById('anch').onchange=ui;document.getElementById('ghost').onchange=ui;
ui();
</script>
