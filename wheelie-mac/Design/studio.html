<title>Taller de Motos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a bench. Left rail picks the machine, the big stage shows it side-on with the real wheelbase,
   and a contact sheet below compares the whole garage at one scale. */
:root{
  --bg:#EEF1F2; --panel:#FFFFFF; --ink:#172127; --mute:#5B6A72; --line:#D3DADD; --accent:#C8421C; --stage:#E3EAED; --ground:#9AA7AD;
  --font-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --font-d:"Space Grotesk","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10171B;--panel:#192227;--ink:#E7EDEF;--mute:#93A2AA;--line:#2B373D;--accent:#FF8A57;--stage:#1D282E;--ground:#42535B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171B;--panel:#192227;--ink:#E7EDEF;--mute:#93A2AA;--line:#2B373D;--accent:#FF8A57;--stage:#1D282E;--ground:#42535B;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-ui);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px}
h1{font:600 24px/1.1 var(--font-d);margin:0;letter-spacing:-.01em}
.sub{color:var(--mute);margin:4px 0 0;max-width:62ch}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;margin-bottom:16px}
.tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.tools label{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:12.5px}
.sw{display:flex;gap:6px}
.sw button{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
.sw button[aria-pressed="true"]{border-color:var(--ink)}
.main{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px}
@media(max-width:760px){.main{grid-template-columns:1fr}}
nav{display:flex;flex-direction:column;gap:2px}
@media(max-width:760px){nav{flex-direction:row;flex-wrap:wrap}}
nav button{font:inherit;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:7px 10px;color:var(--mute);cursor:pointer;border-radius:0 6px 6px 0}
nav button small{display:block;font-size:11.5px;opacity:.8}
nav button[aria-current="true"]{color:var(--ink);border-left-color:var(--accent);background:var(--panel);font-weight:600}
nav button:focus-visible,.sw button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0}
.stage svg{display:block;width:100%;height:auto;max-height:78vh}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:16px}
.cell{background:var(--stage);border:1px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;min-width:0}
.cell b{display:block;font:600 12px var(--font-d);padding:2px 6px;color:var(--mute)}
.cell svg{display:block;width:100%;height:auto}
.note{color:var(--mute);font-size:12.5px;margin:10px 2px 0}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;600&display=swap">

<header>
  <div><h1>Taller de Motos</h1>
  <p class="sub">Las siluetas de Wheelie Ride a escala real: la distancia entre ejes, las ruedas y los puntos del piloto son los de la física. Lo que se ve aquí es lo que se dibuja en el juego.</p></div>
  <div class="tools">
    <div class="sw" id="sw" role="group" aria-label="Color de pintura"></div>
    <label><input type="checkbox" id="anch" checked> Puntos del piloto</label>
    <label><input type="checkbox" id="ghost" checked> Piloto de referencia</label>
  </div>
</header>
<div class="main">
  <nav id="nav" aria-label="Motos"></nav>
  <div><div class="stage" id="stage"></div><p class="note" id="note"></p></div>
</div>
<div class="sheet" id="sheet"></div>

<script>
// Wheelie Ride: motorcycle body designs. Single source of truth for the Design Studio artifact and
// for Sources/BikeShapes.swift (baked by Design/bake.mjs). Units: drawing units, origin on the rear
// axle, x forward, y up. Wheels, fork, swingarm, shock, handlebar, brakes and pegs are drawn by the
// app itself; the layers below are everything else on the bike.
(function (g) {
  const r2 = v => Math.round(v * 100) / 100;
  // Smooth closed/open outline through points; a third value of 1 makes a corner.
  function sm(pts, closed = true) {
    const n = pts.length, P = pts.map(p => [p[0], p[1]]);
    const tan = i => {
      if (pts[i][2]) return [0, 0];
      const a = closed ? P[(i + n - 1) % n] : P[Math.max(0, i - 1)], b = closed ? P[(i + 1) % n] : P[Math.min(n - 1, i + 1)];
      return [(b[0] - a[0]) / 2, (b[1] - a[1]) / 2];
    };
    let d = `M${r2(P[0][0])} ${r2(P[0][1])}`;
    for (let i = 0; i < (closed ? n : n - 1); i++) {
      const j = (i + 1) % n, t0 = tan(i), t1 = tan(j);
      d += `C${r2(P[i][0] + t0[0] / 3)} ${r2(P[i][1] + t0[1] / 3)} ${r2(P[j][0] - t1[0] / 3)} ${r2(P[j][1] - t1[1] / 3)} ${r2(P[j][0])} ${r2(P[j][1])}`;
    }
    return d + (closed ? 'Z' : '');
  }
  // Straight-edged polygon.
  function poly(pts) { return 'M' + pts.map(p => `${r2(p[0])} ${r2(p[1])}`).join('L') + 'Z'; }
  function line(pts) { return 'M' + pts.map(p => `${r2(p[0])} ${r2(p[1])}`).join('L'); }
  function lerp(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }
  // Tapered capsule between two points.
  function cap(a, b, w0, w1) {
    const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy), ux = dx / l, uy = dy / l, nx = -uy, ny = ux;
    const m = lerp(a, b, .5), wm = (w0 + w1) / 4;
    return sm([[a[0] + nx * w0 / 2, a[1] + ny * w0 / 2, 1], [m[0] + nx * wm, m[1] + ny * wm], [b[0] + nx * w1 / 2, b[1] + ny * w1 / 2, 1],
      [b[0] + ux * w1 * .45, b[1] + uy * w1 * .45], [b[0] - nx * w1 / 2, b[1] - ny * w1 / 2, 1], [m[0] - nx * wm, m[1] - ny * wm],
      [a[0] - nx * w0 / 2, a[1] - ny * w0 / 2, 1], [a[0] - ux * w0 * .45, a[1] - uy * w0 * .45]]);
  }
  // Crescent around a wheel: inner/outer radius, angles in degrees (0 = front, 90 = top, 180 = rear).
  function crescent(cx, cy, rin, rout, a0, a1, valance = 0) {
    const P = (r, a) => [cx + Math.cos(a * Math.PI / 180) * r, cy + Math.sin(a * Math.PI / 180) * r];
    const out = [], inn = [], N = 7;
    for (let i = 0; i <= N; i++) { const a = a0 + (a1 - a0) * i / N; out.push(P(rout, a)); }
    for (let i = N; i >= 0; i--) { const a = a0 + (a1 - a0) * i / N; inn.push(P(rin - (i === 0 || i === N ? valance : 0), a)); }
    const pts = [];
    out.forEach((p, i) => pts.push(i === 0 || i === N ? [p[0], p[1], 1] : p));
    inn.forEach((p, i) => pts.push(i === 0 || i === N ? [p[0], p[1], 1] : p));
    return sm(pts);
  }
  // Layer constructors. z: 0 under the near swingarm, 1 body, 2 front end (after the near fork), 3 on top (after the bars).
  const F = (z, role, d, ol = 0.85) => ({ z, t: 'f', role, d, ol });                  // filled panel
  const T = (z, role, d, w) => ({ z, t: 's', role, d, w });                           // tube with edge and highlight
  const O = (z, role, x, y, r) => ({ z, t: 'c', role, x, y, r });                    // disc
  const L = (z, role, d, w, a = 1) => ({ z, t: 'l', role, d, w, a });                 // thin line
  const X = (z, role, x, y, size, str) => ({ z, t: 'x', role, x, y, size, str });     // lettering
  const rig = (F_, R, seat, grip, peg, fm, shock, pivot = [43, 10]) => ({ F: F_, R, seat, grip, peg, fm, shock, pivot });

  // Steering axis helpers: point at distance t above the front axle along the fork.
  const axis = (rg, t) => { const dx = rg.fm[0] - rg.F, dy = rg.fm[1], l = Math.hypot(dx, dy); return [rg.F + dx / l * t, dy / l * t]; };
  const nrm = rg => { const dx = rg.fm[0] - rg.F, dy = rg.fm[1], l = Math.hypot(dx, dy); return [-dy / l, dx / l]; };   // forward-facing normal

  // Air-cooled single: crankcase, clutch cover, finned barrel leaning forward and a head.
  function engine(ox, oy, s = 1, lean = 1) {
    const P = (x, y) => [ox + x * s, oy + y * s];
    const out = [];
    out.push(F(0, 'metal', sm([[...P(0, 10), 1], P(2, 20), P(12, 23.5), P(24, 21), [...P(29, 12), 1], P(26, 3), P(14, 0), P(4, 3.5)]), .9));
    const bl = P(10, 21), br = P(26, 21), tl = P(10 + 11 * lean, 40), tr = P(26 + 9 * lean, 36);
    out.push(F(0, 'metalDk', poly([bl, br, tr, tl]), .9));
    for (let i = 1; i <= 5; i++) { const t = i / 6; out.push(L(0, 'black', line([lerp(bl, tl, t), lerp(br, tr, t)]), 1.0, .85)); out.push(L(0, 'chrome', line([lerp(bl, tl, t - .06), lerp(br, tr, t - .06)]), .5, .55)); }
    const hl = P(10 + 11 * lean - 1.5, 39), hr = P(26 + 9 * lean + 1.5, 35);
    out.push(F(0, 'dark', sm([[...hl, 1], [...hr, 1], [...P(26 + 9 * lean + 2, 43.5), 1], [...P(10 + 11 * lean - 2.5, 46), 1]]), .9));
    const c = P(13, 11);
    out.push(O(0, 'metalLt', ...c, 8.3 * s), O(0, 'metal', ...c, 5.6 * s), O(0, 'black', ...c, 2.2 * s));
    for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2 + .6; out.push(O(0, 'black', c[0] + Math.cos(a) * 6.9 * s, c[1] + Math.sin(a) * 6.9 * s, .8)); }
    return out;
  }

  const D = { rigs: {}, bikes: {} };

  // ───────── Street 125: classic roadster ─────────
  D.rigs.commuter = rig(106, 23, [30, 45], [84, 67], [42, 11], [81, 57], [27, 36]);
  D.bikes.commuter = [
    T(1, 'chrome', sm([[66, 27], [70, 17], [62, 8], [48, 5.6], [36, 7]], false), 3.8),
    F(1, 'chrome', cap([36, 9], [-6, 18], 10, 8.6), .9),
    F(1, 'black', cap([-6, 17.6], [-10, 18.7], 8.9, 8.2), .7),
    L(0, 'steel', line([[36, 6.5], [-6, 15]]), 0),
    T(0, 'steel', sm([[79, 60], [62, 55], [44, 49.5], [32, 47.5]], false), 3.6),
    T(0, 'steel', sm([[32, 46.5], [14, 45], [-10, 41]], false), 2.8),
    T(0, 'steel', sm([[80, 56], [71, 42], [62, 24], [54, 9]], false), 3.6),
    T(0, 'steel', sm([[54, 9], [44, 4.6], [32, 6]], false), 3.0),
    T(0, 'steel', sm([[44, 11], [37, 28], [28, 46]], false), 3.0),
    ...engine(33, 5, 1, 1),
    F(1, 'paint', sm([[10, 26, 1], [11, 38], [24, 43], [34, 41.5], [36, 30, 1], [28, 22.5], [17, 22]]), .85),
    L(1, 'white', line([[14, 29], [30, 33]]), 1.3, .55),
    F(1, 'seat', sm([[-8, 45.5, 1], [-4, 48.6], [14, 49.6], [32, 49.4], [44, 48.4, 1], [43, 45], [30, 44.6], [10, 44.3], [-4, 43.8]]), .85),
    L(1, 'chrome', line([[-3, 48.4], [32, 49]]), .6, .55),
    T(0, 'steel', sm([[-8, 43], [-13, 32], [-18.5, 23]], false), 2.2),
        F(1, 'paint', crescent(0, 0, 25.6, 28.8, 62, 142, 0), .75),
    F(1, 'paint', sm([[-17, 34.5, 1], [-15.5, 40.5], [-7, 44.2], [6, 44.8, 1], [2, 38.4], [-6, 35]]), .75),
    F(1, 'red', sm([[-19.8, 38.6, 1], [-16.6, 41.4, 1], [-15.4, 38.4, 1], [-18, 36.8, 1]]), .5),
    F(1, 'paint', sm([[43, 47.5, 1], [45, 54.5], [55, 60.5], [68, 63.6], [79, 61.2, 1], [79, 56], [72, 51.4], [60, 48.8]]), .9),
    L(1, 'white', line([[48, 56], [62, 61.5], [74, 62]]), 1.1, .6),
    L(1, 'paintDk', line([[46, 50.4], [62, 51.8], [76, 54.5]]), 2.6, .7),
    F(1, 'chrome', sm([[62, 63.7, 1], [66, 65.6], [70, 63.7, 1], [66, 63.3]]), .6),
    // front end
    F(2, 'paint', crescent(106, 0, 25.6, 29.6, 20, 140, 3), .85),
    F(3, 'chrome', sm([[88, 52, 1], [89.5, 56.5], [96, 56.5], [97, 51.5, 1], [92, 50]]), .8),   // lamp bracket pad
    O(3, 'chrome', 91.5, 58, 7.2), O(3, 'lamp', 91.5, 58, 5.2), O(3, 'white', 91.5, 58, 2.0),
    O(3, 'dark', 80, 70, 4.6), O(3, 'cream', 80, 70, 3.1),
  ];

  // ───────── Scrambler 400 ─────────
  D.rigs.scrambler = rig(112, 26, [30, 49], [85, 72], [44, 13], [87, 65], [27, 36]);
  D.bikes.scrambler = [
    T(1, 'chrome', sm([[70, 32], [74, 21], [66, 10], [50, 7.5], [32, 12], [14, 24], [2, 33]], false), 3.8),
    F(1, 'chrome', cap([14, 26], [-12, 39.5], 8.8, 7.6), .9),
    F(1, 'black', cap([-12, 39], [-15.5, 40.8], 7.8, 7.2), .7),
    T(0, 'steel', sm([[88, 68], [64, 59], [44, 53], [30, 51.5]], false), 3.6),
    T(0, 'steel', sm([[30, 50.5], [10, 49], [-10, 46.5]], false), 2.8),
    T(0, 'steel', sm([[88, 63], [76, 44], [66, 22], [56, 8]], false), 3.6),
    T(0, 'steel', sm([[56, 8], [44, 5], [32, 7]], false), 3.0),
    T(0, 'steel', sm([[44, 11], [36, 30], [26, 50]], false), 3.0),
    ...engine(35, 5, 1.04, .8),
    F(1, 'paint', crescent(0, 0, 29, 32.4, 56, 150, 0), .75),
    O(1, 'white', 22, 32, 9.6), O(1, 'paintDk', 22, 32, 7.9), X(1, 'white', 22, 32, 11, '4'),
    F(1, 'tan', sm([[-10, 50, 1], [-4, 53.4], [16, 54.4], [38, 54], [48, 52.6, 1], [47, 49], [30, 48], [8, 47.6], [-6, 47]]), .85),
    L(1, 'tanLt', line([[-2, 52.6], [38, 53.2]]), .6, .7),
    F(1, 'paint', sm([[-20, 42, 1], [-17, 48.5], [-8, 52], [10, 52.6, 1], [4, 45.5], [-8, 42]]), .75),
    F(1, 'red', sm([[-22, 46, 1], [-19, 49, 1], [-17.4, 46, 1], [-20, 44.2, 1]]), .5),
    F(1, 'paint', sm([[44, 53, 1], [46, 60], [56, 65.4], [70, 67.6], [81, 66, 1], [80, 60.5], [72, 55.6], [58, 53.2]]), .9),
    L(1, 'white', line([[48, 61], [62, 66], [76, 66.6]]), 1.1, .6),
    L(1, 'paintDk', line([[47, 55.4], [62, 56.4], [78, 59.5]]), 2.6, .7),
    F(1, 'chrome', sm([[62, 67.6, 1], [66, 69.4], [70, 67.7, 1], [66, 67.3]]), .6),
    F(2, 'paint', crescent(112, 0, 31, 34.4, 20, 130, 3), .85),
    O(3, 'chrome', 98, 66, 7.4), O(3, 'lamp', 98, 66, 5.4), O(3, 'white', 98, 66, 2.1),
  ];

  // ───────── Volt E-8 ─────────
  D.rigs.electric = rig(104, 23, [30, 46], [80, 66], [44, 10], [79, 57], [27, 36]);
  D.bikes.electric = [
    L(0, 'black', line([[44, 18.2], [4, 6.5]]), 1.4, .9),
    T(0, 'steel', sm([[78, 59], [64, 54.5], [50, 50], [32, 48]], false), 3.6),
    T(0, 'steel', sm([[32, 47], [14, 45.5], [-8, 42]], false), 2.8),
    T(0, 'steel', sm([[79, 55], [68, 36], [58, 14], [46, 8]], false), 3.8),
    F(0, 'dark', sm([[30, 9, 1], [29, 34], [36, 42], [56, 44.5], [67, 40], [68, 20, 1], [60, 8], [42, 6]]), 1.0),    // battery pack
    L(0, 'black', line([[36, 10], [36, 40]]), 1, .6), L(0, 'black', line([[42, 8], [42, 43]]), 1, .6), L(0, 'black', line([[48, 8], [48, 44]]), 1, .6), L(0, 'black', line([[54, 8], [54, 44]]), 1, .6), L(0, 'black', line([[60, 9], [60, 43]]), 1, .6),
    F(0, 'green', sm([[34, 35, 1], [62, 36.2, 1], [62, 38.6, 1], [34, 37.4, 1]]), .5),
    O(0, 'metalLt', 43, 12.6, 8.2), O(0, 'metal', 43, 12.6, 5.6), O(0, 'orange', 43, 12.6, 2.4),
    F(1, 'paint', sm([[9, 28, 1], [10, 38], [22, 42.5], [33, 41, 1], [31, 29], [20, 24]]), .85),
    F(1, 'seat', sm([[-8, 46, 1], [-4, 48.8], [14, 49.6], [34, 49.2], [46, 47.4, 1], [44, 44.8], [30, 44.4], [10, 44.2], [-4, 43.8]]), .85),
    F(1, 'paint', sm([[-16, 35, 1], [-14, 41], [-6, 44.4], [8, 44.8, 1], [3, 38], [-5, 34.5]]), .75),
    F(1, 'paint', crescent(0, 0, 25.4, 28.4, 55, 150, 0), .75),
    F(1, 'red', sm([[-18.5, 39, 1], [-15.5, 42, 1], [-14, 39, 1], [-16.8, 37, 1]]), .5),
    F(1, 'paint', sm([[34, 49.6, 1], [40, 55], [56, 59.4], [72, 61, 1], [76, 57.8], [72, 53.4], [54, 50.5]]), .9),
    L(1, 'green', line([[44, 55], [70, 58.2]]), 1.2, .9),
    F(2, 'paint', crescent(104, 0, 25.6, 29.4, 22, 140, 3), .85),
    F(3, 'dark', sm([[86, 52, 1], [88, 59.5], [96, 60.2, 1], [96, 52]]), .8),
    F(3, 'lamp', sm([[89, 54.6, 1], [89.2, 58.8], [93.8, 59.2, 1], [93.8, 54.6]]), .5),
  ];

  // ───────── Enduro 250 ─────────
  D.rigs.motocross = rig(111, 26, [29, 57], [82, 82], [43, 17], [86, 76], [27, 47]);
  D.bikes.motocross = [
    T(1, 'chrome', sm([[78, 36], [86, 24], [76, 8], [58, 5], [44, 12], [22, 26], [6, 38], [-8, 45]], false), 4.4),
    F(1, 'chrome', cap([6, 40], [-18, 53], 9.4, 8.2), .9),
    F(1, 'black', cap([-18, 52.6], [-21.5, 54.4], 8.2, 7.6), .7),
    T(0, 'steel', sm([[84, 78], [60, 68], [40, 62], [28, 60]], false), 3.6),
    T(0, 'steel', sm([[85, 72], [70, 52], [56, 30], [50, 14]], false), 3.8),
    T(0, 'steel', sm([[44, 11], [32, 30], [18, 52]], false), 3.2),
    T(0, 'steel', sm([[28, 60], [4, 58], [-12, 53]], false), 3.0),
    ...engine(37, 6, 1.1, 1),
    F(0, 'dark', sm([[34, 8, 1], [34, 3.6], [52, 0.5], [67, 2.4, 1], [66, 6], [46, 9]]), .8),
    F(1, 'seat', sm([[-14, 57, 1], [0, 60.6], [26, 61.6], [48, 60.4], [58, 58.6, 1], [47, 56.2], [24, 55.6], [0, 55.4]]), .85),
    F(1, 'paint', sm([[-27, 53, 1], [-22, 59], [-8, 61.6], [14, 61.4, 1], [6, 56.6], [-10, 55.2]]), .75),
    F(1, 'paint', crescent(0, 0, 29.4, 32.2, 100, 146, 0), .6),
    F(1, 'white', sm([[44, 56.6, 1], [47, 69], [58, 76], [66, 74, 1], [63, 62.4], [54, 57.4]]), .9),
    F(1, 'paint', sm([[50, 69, 1], [58, 76.2], [74, 79], [86, 77, 1], [84, 72.4], [70, 70.6], [56, 70]]), .9),
    X(1, 'dark', 55, 63.6, 10, '7'),
    F(2, 'paint', crescent(111, 0, 30, 33.4, 22, 150, 0), .85),
    F(2, 'white', sm([[93, 74, 1], [94, 85], [101, 89], [107, 85, 1], [105, 75]]), .9),
    X(2, 'dark', 100, 80, 7.5, '7'),
  ];

  // ───────── Trial 200 ─────────
  D.rigs.trials = rig(108, 27, [34, 61], [83, 80], [44, 16], [83, 76], [27, 47]);
  D.bikes.trials = [

<script>
const D = DESIGN, NAMES = {commuter:['Street 125','Uso diario'],scrambler:['Scrambler 400','Asfalto y tierra'],electric:['Volt E-8','Eléctrica'],motocross:['Enduro 250','Campo y saltos'],trials:['Trial 200','Equilibrio y técnica'],cruiser:['Cruiser 750','Crucero relajado'],scooter:['Scooter 80','Ligero y urbano'],sport:['Sport 600','Alta potencia'],hyperbike:['Hyper R 1000','Superdeportiva'],bmx:['BMX','Sin motor']};
const ORDER = ['bmx','commuter','scrambler','electric','motocross','trials','cruiser','scooter'];
const PAINTS = ['#E9A82B','#D9402B','#2F7FD0','#2E9E6A','#EDEFF0','#1D2327'];

const INK = '#141B20';

function mix(c,t,k){const a=hex(c),b=hex(t);return '#'+a.map((v,i)=>Math.round(v+(b[i]-v)*k).toString(16).padStart(2,'0')).join('')}
function roleCols(role){
  if(role==='paint') return [mix(paint,'#ffffff',.42),paint,mix(paint,'#000000',.32)];
  if(role==='paintDk') return [mix(paint,'#000000',.4),mix(paint,'#000000',.5)];
  return D.roles[role]||['#888','#444'];
}
let uid=0;
function render(kind){
  const R = D.rigs[kind], layers = D.bikes[kind]||[], id='g'+(uid++);
  const defs=[], cache={};
  function grad(role){
    if(cache[role]) return cache[role];
    const c=roleCols(role), gid=id+role; let st;
    if(c.length===1) st=`<stop offset="0" stop-color="${c[0]}"/>`;
    else if(c.length===2) st=`<stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/>`;
    else st=`<stop offset="0" stop-color="${c[0]}"/><stop offset=".2" stop-color="${c[1]}"/><stop offset=".56" stop-color="${c[1]}"/><stop offset=".58" stop-color="${c[2]}"/><stop offset="1" stop-color="${c[2]}"/>`;
    defs.push(`<linearGradient id="${gid}" x1="0" y1="1" x2="0" y2="0">${st}</linearGradient>`);
    return cache[role]=`url(#${gid})`;
  }
  const flat = role => roleCols(role)[Math.min(1,roleCols(role).length-1)];
  const ax = (t)=>{const dx=R.fm[0]-R.F,dy=R.fm[1],l=Math.hypot(dx,dy);return [R.F+dx/l*t,dy/l*t]};
  const flen = Math.hypot(R.fm[0]-R.F,R.fm[1]);

    let s=`<g transform="translate(${x} 0)"><circle r="${R.R}" fill="#1A2228" stroke="${INK}" stroke-width=".9"/>`;
    s+=`<circle r="${R.R*.9}" fill="none" stroke="#3A464E" stroke-width="1"/><circle r="${R.R*.78}" fill="#C9D1D4" stroke="${INK}" stroke-width=".7"/><circle r="${R.R*.7}" fill="#26323A"/>`;
    for(let i=0;i<18;i++){const a=i*Math.PI/9;s+=`<line x1="0" y1="0" x2="${Math.cos(a)*R.R*.7}" y2="${Math.sin(a)*R.R*.7}" stroke="#AEB9BE" stroke-width=".55"/>`}
    if(front) s+=`<circle r="${R.R*.44}" fill="#9AA6AB" stroke="${INK}" stroke-width=".5"/><circle r="${R.R*.36}" fill="#34414A"/>`;
    return s+`<circle r="${R.R*.15}" fill="#8E9BA1" stroke="${INK}" stroke-width=".7"/><circle r="${R.R*.06}" fill="#202A30"/></g>`;
  };
  const tube=(p,w,c,e)=>`<path d="${p}" fill="none" stroke="${e||INK}" stroke-width="${w+1.7}" stroke-linecap="round" stroke-linejoin="round"/><path d="${p}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const pv=R.pivot, lowShock=[pv[0]*.48,pv[1]*.48];

    swing: tube(`M${pv[0]} ${pv[1]} L0 0`,5,'#323E45'),
    shock: (()=>{let s='',a=R.shock,b=lowShock,n=9;for(let i=0;i<n;i++){const t=(i+.5)/n,p=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];s+=`<line x1="${p[0]-2.6}" y1="${p[1]+.9}" x2="${p[0]+2.6}" y2="${p[1]-.9}" stroke="#B8C2C6" stroke-width="1.5"/>`}return `<path d="M${a[0]} ${a[1]}L${b[0]} ${b[1]}" stroke="#1A2227" stroke-width="2" fill="none"/>`+s})(),
    nearFork: tube(`M${ax(flen+6)} L${R.F} 0`.replace(/,/g,' '),4.4,'#CBD3D6')+tube(`M${ax(flen*.42)} L${R.F} 0`.replace(/,/g,' '),3.2,'#8E9BA1'),
    bars: (()=>{const t=ax(flen+7);return tube(`M${t[0]} ${t[1]} L${R.fm[0]+(R.grip[0]-R.fm[0])*.4} ${R.fm[1]+(R.grip[1]-R.fm[1])*.55} L${R.grip[0]} ${R.grip[1]}`,2.4,'#C7CED1')+`<circle cx="${R.grip[0]}" cy="${R.grip[1]}" r="3.4" fill="#151C20"/>`})(),
    peg: `<path d="M${R.peg[0]-4} ${R.peg[1]}L${R.peg[0]+7} ${R.peg[1]}" stroke="${INK}" stroke-width="4" stroke-linecap="round"/><path d="M${R.peg[0]-4} ${R.peg[1]}L${R.peg[0]+7} ${R.peg[1]}" stroke="#7D8A91" stroke-width="2.4" stroke-linecap="round"/>`
  };
  function drawLayer(l){
    if(l.t==='f') return `<path d="${l.d}" fill="${grad(l.role)}" stroke="${INK}" stroke-width="${l.ol}" stroke-linejoin="round"/>`;
    if(l.t==='s'){const c=flat(l.role);return tube(l.d,l.w,c,'#12191D')+`<path d="${l.d}" fill="none" stroke="${mix(c,'#ffffff',.45)}" stroke-width="${Math.max(.5,l.w*.22)}" stroke-linecap="round" transform="translate(-${l.w*.15} ${l.w*.2})" opacity=".8"/>`}

    if(l.t==='l') return `<path d="${l.d}" fill="none" stroke="${l.role==='paintDk'?roleCols('paintDk')[0]:flat(l.role)}" stroke-width="${l.w}" stroke-linecap="round" opacity="${l.a}"/>`;
    if(l.t==='x') return `<text transform="translate(${l.x} ${l.y}) scale(1 -1)" text-anchor="middle" dominant-baseline="central" font-family="Space Grotesk,sans-serif" font-weight="700" font-size="${l.size}" fill="${flat(l.role)}">${l.str}</text>`;
    return '';
  }
  const Z=z=>layers.filter(l=>l.z===z).map(drawLayer).join('');
  const bm=kind==='bmx';let body=wheel(0,false)+wheel(R.F,true)+mech.farFork+(bm?'':mech.swing+mech.shock)+Z(0)+(bm?`<circle cx="45" cy="0" r="6" fill="#AEBBBC" stroke="${INK}" stroke-width=".8"/>`:mech.swing)+Z(1)+mech.nearFork+Z(2)+mech.bars+Z(3)+mech.peg;
  let over='';
  if(document.getElementById('ghost').checked){
    const h=R.seat,hd=R.grip,pg=R.peg;
    const knee=[(h[0]+pg[0])/2+7,(h[1]+pg[1])/2+3];
    const sh=[h[0]+ (kind==='cruiser'?6:14), h[1]+ (kind==='cruiser'?22:20)];
    over=`<g opacity=".34" stroke="#0E3E6B" stroke-linecap="round" fill="none" stroke-width="7"><path d="M${h} L${knee} L${pg}"/><path d="M${h} L${sh}"/><path d="M${sh} L${hd}"/></g><circle cx="${sh[0]+4}" cy="${sh[1]+9}" r="7.5" fill="#0E3E6B" opacity=".34"/>`;

  return `<svg viewBox="${x0} ${-y1} ${x1-x0} ${y1-y0}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${NAMES[kind][0]}"><defs>${defs.join('')}</defs><g transform="scale(1 -1)"><path d="M${x0} ${gy-.5}H${x1}" stroke="var(--ground)" stroke-width="1.2"/>${body}${over}</g></svg>`;
}
